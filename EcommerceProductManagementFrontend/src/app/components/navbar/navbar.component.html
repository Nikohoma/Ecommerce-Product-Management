<nav class="navbar glass">
  <div class="container nav-content">
    <div class="brand" routerLink="/dashboard">
      <div class="logo1"><img src="assets/rush_logo.png" alt="Rush Mart"></div>
      <span>Rush Mart</span>
    </div>

    <ul class="nav-links" *ngIf="authService.getRole() === 'Customer'">
      <li><a routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-house-door"></i>Home</a></li>
      <li><a routerLink="/catalog" routerLinkActive="active"><i class="bi bi-shop"></i>Products</a></li>
      <li><a routerLink="/cart" routerLinkActive="active" class="cart-link">
          <i class="bi bi-cart3"></i> Cart
        </a></li>
    </ul>

    <ul class="nav-links" *ngIf="authService.getRole() !== 'Customer'">
      <li><a routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-info-circle"></i>Dashboard</a></li>
      <li><a routerLink="/catalog" routerLinkActive="active"><i class="bi bi-shop"></i>Products</a></li>
      <li *ngIf="authService.getRole() !== 'ContentExecutive'"><a routerLink="/product/add" routerLinkActive="active"><i
            class="bi bi-plus-circle"></i>Add Product</a></li>
      <li *ngIf="authService.getRole() === 'Admin'"><a routerLink="/users" routerLinkActive="active"><i
            class="bi bi-person"></i>Users</a></li>
    </ul>

    <div class="user-actions">
      <div class="user-info">
        <span class="role-badge">{{ authService.getRole() }}</span>
        <span class="user-name">{{ (authService.user$ | async)?.email }}</span>
      </div>
      <button (click)="authService.logout()" class="btn-logout">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </div>
</nav>
